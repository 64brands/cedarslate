<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0efee">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Cedar+Slate is an independent Australian software studio.">
  <title>Cedar+Slate — Australian software studio</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
  <style>
    :root{color-scheme:light;--charcoal:#3d3d3d;--orange:#f15a00;--paper:#f0efee;--line:rgba(61,61,61,.22)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;background:var(--paper);color:var(--charcoal);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(24px,4vw,58px)}
    header,footer{display:flex;align-items:center;justify-content:space-between;gap:28px}
    .brand{display:block;width:clamp(210px,25vw,330px)}
    .brand img{display:block;width:100%;height:auto}
    .location{margin:0;font-size:.72rem;font-weight:650;letter-spacing:.16em;text-transform:uppercase}
    main{display:grid;place-items:center;padding:8vh 0}
    .hero{width:min(1280px,100%);text-align:center}
    .rule{display:block;width:44px;height:3px;margin:0 auto 34px;background:var(--orange)}
    h1{margin:0;font-size:clamp(3rem,7vw,7rem);font-weight:350;line-height:.92;letter-spacing:-.04em;white-space:nowrap}
    .intro{max-width:650px;margin:38px auto 0;font-size:clamp(1.04rem,1.8vw,1.3rem);line-height:1.6;font-weight:400}
    footer{border-top:1px solid var(--line);padding-top:24px;font-size:.86rem}
    .contact-trigger{appearance:none;border:0;border-bottom:1px solid var(--orange);padding:0 0 3px;background:none;color:inherit;font:inherit;cursor:pointer}
    .contact-trigger:hover,.contact-trigger:focus-visible{color:var(--orange)}
    dialog{width:min(460px,calc(100vw - 32px));border:1px solid rgba(61,61,61,.16);border-radius:24px;padding:0;background:rgba(240,239,238,.97);color:var(--charcoal);box-shadow:0 24px 80px rgba(20,20,20,.18);backdrop-filter:blur(24px)}
    dialog::backdrop{background:rgba(30,30,30,.28);backdrop-filter:blur(8px)}
    .contact-panel{padding:28px}.contact-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.contact-head h2{margin:0;font-size:1.35rem;font-weight:550;letter-spacing:-.03em}.close{appearance:none;border:0;border-radius:50%;width:32px;height:32px;background:rgba(61,61,61,.09);color:inherit;font-size:1.2rem;line-height:1;cursor:pointer}.contact-form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:.76rem;font-weight:600}.field input,.field textarea{width:100%;border:1px solid rgba(61,61,61,.18);border-radius:12px;background:rgba(255,255,255,.62);color:inherit;font:inherit;font-size:.95rem;padding:11px 13px;outline:none}.field textarea{min-height:112px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(241,90,0,.1)}.form-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:5px}.privacy{margin:0;max-width:230px;font-size:.68rem;line-height:1.4;color:rgba(61,61,61,.72)}.send{appearance:none;border:0;border-radius:999px;padding:10px 18px;background:var(--charcoal);color:var(--paper);font:inherit;font-size:.86rem;font-weight:600;cursor:pointer}.send:hover,.send:focus-visible{background:var(--orange)}.send:disabled{opacity:.55;cursor:wait}.form-status{min-height:1.25em;margin:2px 0 0;font-size:.78rem}.hp{position:absolute;left:-9999px}
    footer a{color:inherit;text-decoration:none;border-bottom:1px solid var(--orange);padding-bottom:3px}
    footer a:hover,footer a:focus-visible{color:var(--orange)}
    @media(max-width:620px){h1{font-size:10vw;white-space:nowrap}header{align-items:flex-start;flex-direction:column}.brand{width:min(260px,78vw)}.location{padding-left:2px}main{padding:11vh 0}footer{align-items:flex-start;flex-direction:column-reverse}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Cedar+Slate home"><img src="/assets/cedar-slate.svg" alt="Cedar+Slate"></a>
    <p class="location">Made in Australia</p>
  </header>
  <main>
    <section class="hero">
      <span class="rule" aria-hidden="true"></span>
      <h1>Thoughtful software,<br>made with purpose.</h1>
      <p class="intro">Cedar+Slate is an independent Australian studio creating useful, beautifully considered software.</p>
    </section>
  </main>
  <footer>
    <span>© 2026 Cedar+Slate</span>
    <button class="contact-trigger" type="button" id="contact-open">Contact</button>
  </footer>
  <dialog id="contact-dialog" aria-labelledby="contact-title">
    <div class="contact-panel">
      <div class="contact-head"><h2 id="contact-title">Contact Cedar+Slate</h2><button class="close" type="button" id="contact-close" aria-label="Close">×</button></div>
      <form class="contact-form" id="contact-form">
        <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="80" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160" required></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" maxlength="3000" required></textarea></div>
        <label class="hp" aria-hidden="true">Company<input name="company" tabindex="-1" autocomplete="off"></label>
        <div id="turnstile"></div>
        <p class="form-status" id="form-status" role="status"></p>
        <div class="form-actions"><p class="privacy">Your details are used only to respond to this enquiry.</p><button class="send" type="submit">Send</button></div>
      </form>
    </div>
  </dialog>
  <script>
    const dialog=document.getElementById("contact-dialog"),form=document.getElementById("contact-form"),status=document.getElementById("form-status"),send=form.querySelector(".send");let widgetId,token="";
    document.getElementById("contact-open").addEventListener("click",()=>{dialog.showModal();setTimeout(()=>{if(widgetId===undefined&&window.turnstile)widgetId=turnstile.render("#turnstile",{sitekey:"0x4AAAAAAD_4kPSYJJw4nIba",theme:"light",size:"flexible",callback:value=>{token=value;status.textContent=""},"expired-callback":()=>token="","error-callback":()=>finish("Security check unavailable. Please try again.",true)})},50)});
    document.getElementById("contact-close").addEventListener("click",()=>dialog.close());
    dialog.addEventListener("click",e=>{if(e.target===dialog)dialog.close()});
    form.addEventListener("submit",async e=>{e.preventDefault();if(!form.reportValidity())return;if(!token){finish("Please complete the security check.",true);return}const data=Object.fromEntries(new FormData(form));send.disabled=true;send.textContent="Sending…";status.textContent="";try{const r=await fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,token})});const result=await r.json();if(!r.ok)throw new Error(result.error||"Unable to send");form.reset();finish("Thanks — your message has been sent.",false)}catch(error){finish(error.message||"Unable to send. Please try again.",true)}finally{token="";turnstile.reset(widgetId)}});
    function finish(message,isError){status.textContent=message;status.style.color=isError?"#a13120":"#2f6b45";send.disabled=false;send.textContent="Send"}
  </script>/body>
</html>
